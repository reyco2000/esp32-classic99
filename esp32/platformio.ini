; Classic99 port for TTGO VGA32 v1.4 (ESP32 + 4MB PSRAM) using FabGL

[env:ttgo-vga32]
platform = espressif32@6.10.0
board = esp32dev
framework = arduino
board_build.partitions = partitions.csv
board_build.f_cpu = 240000000L
monitor_speed = 115200
upload_speed = 921600
lib_extra_dirs = ~/Arduino/libraries
lib_deps = FabGL
build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -O2
build_unflags = -Os
